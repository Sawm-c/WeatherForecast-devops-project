name: Weather App CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: install python (for testing env)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: |
          pip install --no-cache-dir -r backend/requirements.txt
          pip install flake8

      - name: check syntax by flake8
        run: flake8 backend/app.py
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      
      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
           ${{secrets.DOCKERHUB_USERNAME}}/weather-app:latest
           ${{secrets.DOCKERHUB_USERNAME}}/weather-app:${{github.ref_name}}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: deploy to sv EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SV_IP}}
          username: ${{secrets.SV_USER}}
          key: ${{secrets.WF_PRV_KEY}}
          script: |
            if [ ! -d "WeatherForecast-devops-project" ]; then
              git clone https://github.com/Sawm-c/WeatherForecast-devops-project.git
            fi
            
            cd WeatherForecast-devops-project
            git pull origin main
            
            echo "DB_USER=${{ secrets.DB_USER }}" > .env
            echo "DB_PASSW=${{ secrets.DB_PASSW }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "API_KEY=${{ secrets.API_KEY }}" >> .env
            
            docker-compose pull app
            docker-compose up -d

  
